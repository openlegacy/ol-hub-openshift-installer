# Image per component. Defaults are the current tags on public.ecr.aws (all checked 2026-11-19).
# Override any line here, or in install.conf (install.conf wins), e.g. to pin a digest
# (the pre-prefix names IMAGE_TERMIQ, IMAGE_DATAIQ, ... are still accepted in install.conf):
#   IMAGE_OL_COREIQ=public.ecr.aws/openlegacy/hub/coreiq@sha256:9cc7a4e3...
# Tags are re-pushed under the same name, so IMAGE_PULL_POLICY defaults to Always.

# --- mandatory ---
# IMAGE_KEYCLOAK is the only Keycloak pin (the chart has no default). Keycloak cannot be downgraded:
# never set an older version than the one an install already runs. The release zip built from the
# ol-hub repository (ops/openshift-installer) stamps IMAGE_HUB and IMAGE_KEYCLOAK for its release.
IMAGE_POSTGRES=public.ecr.aws/docker/library/postgres:17
IMAGE_KEYCLOAK=openlegacy/openlegacy-keycloak:26.8.0
IMAGE_HUB=public.ecr.aws/openlegacy/hub/ol-hub:4.0.2-onprem

# --- optional apps ---
IMAGE_OL_INTEGRATION=public.ecr.aws/openlegacy/hub/ol-integration:4.0.1-onprem
IMAGE_OL_TERMIQ=public.ecr.aws/openlegacy/hub/ol-termiq:1.0.6-onprem
IMAGE_OL_DATAIQ=public.ecr.aws/openlegacy/hub/ol-dataiq:1.7.0-onprem
IMAGE_OL_DATAIQ_BATCH=public.ecr.aws/openlegacy/hub/dataiq-batch:1.6.8-onprem.727b16b
IMAGE_OL_APPIQ=public.ecr.aws/openlegacy/hub/appiq:1.3.7-onprem-embedded-fix
IMAGE_OL_NEXT=public.ecr.aws/openlegacy/hub/ol-next:1.11.1-onprem
IMAGE_OL_SPEC=public.ecr.aws/openlegacy/hub/olspec:1.0.1-onprem
IMAGE_OL_CODE=public.ecr.aws/openlegacy/hub/ol-code:3.0.55-onprem
IMAGE_OL_TERMINAL=public.ecr.aws/openlegacy/hub/ol-terminal:2.0.18-onprem
IMAGE_OL_COREIQ=public.ecr.aws/openlegacy/hub/coreiq:1.7.11-onprem.71e493e
IMAGE_OL_ATOMIQ=public.ecr.aws/openlegacy/hub/atomiq:1.5.5-onprem

IMAGE_PULL_POLICY=Always
