{{- $g := .Values.global }}
# Realm imported once, on first start (--import-realm skips an existing realm). ${...} placeholders are
# resolved by Keycloak from the container env: the hub-client secret never lands in this ConfigMap.
# install.sh keeps the hub-spa redirect URIs, the user profile and the admin user (linked to the tenant
# the Hub creates) in sync afterwards (kcadm).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.name }}-realm
  labels: {app: {{ .Values.name }}}
data:
  ol-hub.json: |-
{{ .Files.Get "files/realm-ol-hub.json"
   | replace "\"__HUB_CLIENT_SECRET__\"" "\"${KEYCLOAK_MANAGEMENT_CLIENT_SECRET}\""
   | replace "\"__HUB_SPA_REDIRECT_URIS__\"" "\"${HUB_SPA_REDIRECT_URI}\""
   | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  labels: {app: {{ .Values.name }}}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: {{ .Values.name }}}
  template:
    metadata:
      labels: {app: {{ .Values.name }}}
      annotations:
        checksum/realm: {{ .Files.Get "files/realm-ol-hub.json" | sha256sum | trunc 16 }}
    spec:
      {{- with $g.imagePullSecret }}
      imagePullSecrets: [{name: {{ . }}}]
      {{- end }}
      containers:
        - name: keycloak
          image: {{ .Values.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args: [start, --import-realm]
          ports:
            - {name: http, containerPort: 8080}
            - {name: https, containerPort: 8443}
          env:
            # The image sets KC_HTTP_RELATIVE_PATH=/auth and its own TLS keystore (8443).
            - {name: KC_HTTP_ENABLED, value: "true"}
            - {name: KC_HOSTNAME_STRICT, value: "false"}
            # Route terminates TLS (edge) and forwards to 8080: trust X-Forwarded-* for the public https URL
            - {name: KC_PROXY_HEADERS, value: xforwarded}
            - {name: KC_DB, value: postgres}
            - name: KC_DB_URL
              value: jdbc:postgresql://{{ $g.db.host }}:{{ $g.db.port }}/{{ $g.db.name }}
            - {name: KC_DB_SCHEMA, value: {{ .Values.dbSchema }}}
            - name: KC_DB_USERNAME
              valueFrom: {secretKeyRef: {name: {{ $g.dbSecret }}, key: OL_DB_USER}}
            - name: KC_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ $g.dbSecret }}, key: OL_DB_PASSWORD}}
            # Master-realm admin, created on first start only
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom: {secretKeyRef: {name: {{ $g.keycloakAdminSecret }}, key: username}}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ $g.keycloakAdminSecret }}, key: password}}
            # Realm import placeholders
            - name: KEYCLOAK_MANAGEMENT_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: {{ $g.hubSecret }}, key: KEYCLOAK_MANAGEMENT_CLIENT_SECRET}}
            - name: HUB_SPA_REDIRECT_URI
              value: https://{{ $g.hubHost }}/*
          startupProbe:
            httpGet: {path: /auth/realms/master, port: 8080}
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /auth/realms/ol-hub, port: 8080}
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet: {path: /auth/realms/master, port: 8080}
            periodSeconds: 20
            failureThreshold: 3
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import/ol-hub.json
              subPath: ol-hub.json
      volumes:
        - name: realm
          configMap: {name: {{ .Values.name }}-realm}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
  labels: {app: {{ .Values.name }}}
spec:
  selector: {app: {{ .Values.name }}}
  ports:
    - {name: http, port: 80, targetPort: http}
    - {name: https, port: 443, targetPort: https}
{{- if .Values.route.enabled }}
---
# Browser login origin. Its https URL + /auth/realms/ol-hub is the token issuer every app compares to.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ .Values.name }}
  labels: {app: {{ .Values.name }}}
spec:
  host: {{ $g.keycloakHost }}
  to: {kind: Service, name: {{ .Values.name }}}
  port: {targetPort: http}
  tls: {termination: edge, insecureEdgeTerminationPolicy: Redirect}
{{- end }}
